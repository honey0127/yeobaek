# 여백 서버: 스모크 테스트 → Fly.io 자동 배포
#
# main 에 서버 코드가 올라가면 자동으로 검증하고 배포한다 — 로컬 터미널에서
# uvicorn 을 켜 둘 필요가 없어진다.
#
# 최초 1회만 준비하면 된다(그 뒤로는 push 만 하면 자동):
#   1) flyctl auth token           # 토큰 발급
#   2) GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret
#      이름: FLY_API_TOKEN, 값: 위에서 발급한 토큰
# 토큰이 없으면 배포 단계는 조용히 건너뛰고 스모크 테스트만 돈다(빨간 X 안 남게).

name: 서버 배포 (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - "yeobaek/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "yeobaek/**"
  workflow_dispatch:        # Actions 탭에서 손으로도 실행 가능

jobs:
  smoke:
    name: 스모크 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yeobaek/server/requirements.txt

      - name: 의존성 설치
        working-directory: yeobaek
        run: pip install -r server/requirements.txt

      - name: 서버 기동
        working-directory: yeobaek
        run: |
          python -m uvicorn server.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 20); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 1
          done

      - name: 엔드포인트 검증 (demo_smoke)
        working-directory: yeobaek
        run: python scripts/demo_smoke.py

      - name: 실패 시 서버 로그
        if: failure()
        working-directory: yeobaek
        run: cat uvicorn.log

  deploy:
    name: Fly.io 배포
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FLY_API_TOKEN 설정 여부 확인
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN 시크릿이 없어 배포를 건너뛴다. yeobaek/DEPLOY.md 참고."
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      # data/*.db 와 data/*.npy 는 .gitignore 에 있다(스크립트로 재현하는 산출물).
      # 그래서 CI 체크아웃에는 데이터가 없고, 여기서 만든 이미지는 명소 0건으로 뜬다.
      # 배포를 막지는 않는다 — 볼륨을 붙여 쓰는 구성도 있으므로. 대신 크게 경고한다.
      - name: 이미지에 데이터가 들어가는지 확인
        if: steps.token.outputs.set == 'true'
        working-directory: yeobaek
        run: |
          if [ ! -f data/yeobaek.db ] || [ ! -f data/embeddings.npy ]; then
            echo "::warning::CI 체크아웃에는 data/yeobaek.db·embeddings.npy 가 없다(gitignore). \
          이 배포로 만들어지는 이미지는 명소 0건이다. 볼륨을 붙이지 않았다면 데이터가 바뀔 때마다 \
          내 PC에서 'flyctl deploy' 로 배포할 것. 자세한 내용은 yeobaek/DEPLOY.md 참고."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.set == 'true'

      - name: 배포
        if: steps.token.outputs.set == 'true'
        working-directory: yeobaek
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --remote-only: 러너에 도커 빌더가 없어도 Fly 빌더에서 이미지를 만든다.
        run: flyctl deploy --remote-only

      - name: 배포 확인
        if: steps.token.outputs.set == 'true'
        working-directory: yeobaek
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP=$(grep -m1 '^app = ' fly.toml | sed 's/.*"\(.*\)".*/\1/')
          for i in $(seq 12); do
            if curl -sf "https://$APP.fly.dev/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::배포 후 /health 응답 없음"; exit 1
