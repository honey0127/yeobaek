# Fly.io 배포 설정. 앱 이름은 최초 `flyctl launch` 시 고유해야 하므로 필요하면 바꿀 것 —
# 그러면 서비스 주소도 https://<app 이름>.fly.dev 로 함께 바뀐다.
#
# `yeobaek-api` 는 이미 제3자가 선점하고 있다(그 주소로 요청하면 남의 서버가 응답한다).
# 그래서 `flyctl launch` 가 접미사를 붙여 만든 아래 이름을 쓴다. 이름을 바꾸려면
# 여기와 local.properties 의 DEV_BASE_URL/PROD_BASE_URL 을 **반드시 함께** 고칠 것.
app = "yeobaek-api-plucky-voice-2925"
primary_region = "nrt"   # 도쿄 — 한국에서 가장 가까운 Fly 리전(서울 리전 없음)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # 앱이 죽어 있으면 Fly 가 머신을 재시작한다(무응답 상태로 방치되지 않게).
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# 재배포에도 여행자 제보·예보 관측(forecast_cache)을 유지한다.
#
# ⚠ 이 볼륨이 **없으면 배포가 실패한다.** 최초 1회 반드시 먼저 만들 것:
#   flyctl volumes create yeobaek_data --size 1 --region nrt
#
# 볼륨이 없던 동안에는 /data 가 컨테이너 수명만큼만 살아 있어서, D+1 역사 평균의
# 표본(forecast_cache)이 재배포마다 0으로 돌아갔다. 표본이 쌓여야 정확해지는
# 구조라 이건 기능이 꺼져 있던 것이나 마찬가지였다.
[mounts]
  source = "yeobaek_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
